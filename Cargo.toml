[package]
name = "core"
version = "0.1.0"
edition = "2021"

[lib]
name = "core_launcher"
path = "src/lib.rs"

[dependencies]
core-types = { path = "core-types" }
anyhow = "1.0.102"
chrono = { version = "0.4.42", features = ["clock"] }
chrono-tz = "0.10.4"
global-hotkey = "0.8.0"
gpui = { git = "https://github.com/zed-industries/zed", rev = "43585afc29ea95e0c879309e08436bc25f5fab16" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "43585afc29ea95e0c879309e08436bc25f5fab16" }
iana-time-zone = "0.1.64"
image = { version = "0.25.10", default-features = false, features = ["png"] }
meval = "0.2.0"
once_cell = "1.21.3"
raw-window-handle = "0.6.2"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = "0.9.8"
unicode-segmentation = "1.12.0"
ureq = "2.12.1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
walkdir = "2.5.0"
qrcode = "0.14"
cron = "0.15"
jsonpath-rust = "0.7"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0.9"

[[bench]]
name = "search_latency"
harness = false
